  <style>
    /* Reset */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #a18cd1, #fbc2eb);
      background-size: 400% 400%;
      animation: gradientBG 20s ease infinite;
      color: #333;
      line-height: 1.6;
      overflow-x: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    a { color: #4a90e2; text-decoration: none; }
    a:hover { text-decoration: underline; }

    .container {
      max-width: 900px;
      margin: 40px auto;
      background-color: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
      padding: 40px;
      position: relative;
      overflow: hidden;
    }

    /* Floating notes */
    .note {
      position: absolute;
      font-size: 20px;
      color: rgba(255,255,255,0.7);
      animation: floatNote 12s linear infinite;
    }
    @keyframes floatNote {
      0% { transform: translateY(100vh) translateX(0) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      50% { transform: translateY(50vh) translateX(50px) rotate(180deg); }
      100% { transform: translateY(-20vh) translateX(-50px) rotate(360deg); opacity: 0; }
    }

    header h1 {
      font-family: 'Georgia', serif;
      text-align: center;
      font-size: 3rem;
      color: #222;
      margin-bottom: 30px;
      letter-spacing: 1px;
    }

    /* Profile */
    .profile {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 30px;
      margin-bottom: 50px;
    }

    .profile img {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #4a90e2;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      transition: transform 0.5s ease;
      perspective: 1000px;
    }

    .profile img:hover {
      transform: rotateY(10deg) rotateX(5deg) scale(1.08);
    }

    .profile-text {
      flex: 1;
      font-size: 1.15rem;
      color: #444;
      animation: fadeInUp 1s ease forwards;
      opacity: 0;
    }

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    h2 {
      font-family: 'Georgia', serif;
      font-size: 2rem;
      color: #4a90e2;
      margin-bottom: 25px;
      border-left: 5px solid #4a90e2;
      padding-left: 15px;
    }

    /* Photo gallery */
    .photo-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 25px;
      margin-bottom: 50px;
    }

    .photo-gallery img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      transition: transform 0.5s ease, box-shadow 0.5s ease;
    }

    .photo-gallery img:hover {
      transform: scale(1.1) translateY(-10px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    /* Contact info */
    .contact-info {
      background: rgba(245, 247, 250, 0.95);
      padding: 30px 35px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      margin-bottom: 50px;
    }

    .contact-info h3 {
      font-size: 1.6rem;
      color: #4a90e2;
      margin-bottom: 18px;
    }

    .contact-info p, .contact-info address {
      font-size: 1rem;
      margin-bottom: 10px;
      color: #555;
    }

    .social-links {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 15px;
    }

    .social-links a img {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      transition: transform 0.4s, box-shadow 0.4s;
    }

    .social-links a img:hover {
      transform: scale(1.25) rotate(-5deg);
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    }

    /* Music Player */
    .music-player {
      background: rgba(240, 240, 255, 0.9);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 50px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }

    .waveform {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 2px;
      height: 50px;
      margin-bottom: 15px;
    }

    .waveform div {
      width: 4px;
      height: 100%;
      background: #4a90e2;
      animation: wave 1s infinite ease-in-out;
    }

    .waveform div:nth-child(1) { animation-delay: 0s; }
    .waveform div:nth-child(2) { animation-delay: 0.1s; }
    .waveform div:nth-child(3) { animation-delay: 0.2s; }
    .waveform div:nth-child(4) { animation-delay: 0.3s; }
    .waveform div:nth-child(5) { animation-delay: 0.4s; }
    .waveform div:nth-child(6) { animation-delay: 0.5s; }
    .waveform div:nth-child(7) { animation-delay: 0.6s; }

    @keyframes wave {
      0%, 100% { transform: scaleY(0.2); }
      50% { transform: scaleY(1); }
    }

    footer {
      text-align: center;
      font-size: 0.9rem;
      color: #888;
      margin-top: 40px;
    }

    @media (max-width: 600px) {
      .profile { flex-direction: column; text-align: center; }
      .profile img { margin: 0 auto; }
      .profile-text { margin-top: 20px; }
      .waveform { height: 35px; }
    }
  </style>
</head>
